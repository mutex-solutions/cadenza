# A complete self-hosted Cadenza: the server, Postgres and S3-compatible
# storage (SeaweedFS). Copy this file, set the values marked CHANGE, then:
#   docker compose up -d
# Put a TLS reverse proxy (Caddy, nginx, Traefik) in front of ports 8080 and
# 8333 so phones and agents reach them over HTTPS.

services:
  cadenza:
    image: ghcr.io/mutex-solutions/cadenza:latest
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      CADENZA_PUBLIC_URL: https://cadenza.example.com          # CHANGE
      CADENZA_DATABASE: postgres://cadenza:cadenza@postgres:5432/cadenza?sslmode=disable
      CADENZA_S3_ENDPOINT: http://seaweedfs:8333
      CADENZA_S3_PUBLIC_ENDPOINT: https://files.cadenza.example.com   # CHANGE: how phones reach storage
      CADENZA_S3_BUCKET: cadenza
      CADENZA_S3_ACCESS_KEY: cadenza                           # CHANGE
      CADENZA_S3_SECRET_KEY: change-me-to-a-long-secret        # CHANGE
      CADENZA_VAPID_SUBJECT: mailto:you@example.com            # CHANGE
    volumes: ["cadenza-data:/data"]
    depends_on: [postgres, seaweedfs]

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: cadenza
      POSTGRES_PASSWORD: cadenza
      POSTGRES_DB: cadenza
    volumes: ["postgres-data:/var/lib/postgresql/data"]

  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    ports: ["8333:8333"]
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  cadenza-data:
  postgres-data:
  seaweedfs-data:
