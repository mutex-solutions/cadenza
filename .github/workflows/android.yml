name: Android

# Builds the Android release APK. On a version tag (or when run by hand with a
# tag) the APK is attached to that GitHub release, so it can be installed on a
# phone with `adb install`. Pull requests that touch the app build it too.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["web/apps/android/**", "web/packages/**", "web/pnpm-lock.yaml", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the APK to, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  apk:
    name: Build the release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Version for this build
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          ref="${TAG_INPUT:-$GITHUB_REF_NAME}"
          case "$ref" in v*) echo "CADENZA_VERSION_NAME=${ref#v}" >> "$GITHUB_ENV" ;; esac
          echo "CADENZA_VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Generate the native project
        working-directory: web/apps/android
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install

      - name: Build (arm64, the Pixel 6a's architecture)
        working-directory: web/apps/android/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Check the size budget (under 30 MB)
        run: |
          apk=web/apps/android/android/app/build/outputs/apk/release/app-release.apk
          size=$(stat -c %s "$apk")
          echo "APK size: $((size / 1048576)) MB"
          test "$size" -lt $((30 * 1048576))
          cp "$apk" cadenza-android-arm64.apk

      - uses: actions/upload-artifact@v5
        with:
          name: cadenza-android-arm64
          path: cadenza-android-arm64.apk

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" cadenza-android-arm64.apk --clobber --repo "$GITHUB_REPOSITORY"
