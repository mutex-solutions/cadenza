name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go test & vet (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet -tags nodynamic ./...

      - name: Install sqlc
        if: matrix.os == 'ubuntu-latest'
        env:
          SQLC_VERSION: 1.31.1
        run: |
          curl -sSfL "https://downloads.sqlc.dev/sqlc_${SQLC_VERSION}_linux_amd64.tar.gz" | sudo tar -xz -C /usr/local/bin sqlc

      - name: Generated files are up to date
        if: matrix.os == 'ubuntu-latest'
        run: |
          make gen
          git diff --exit-code

      - name: Test
        run: go test -tags nodynamic -race ./...

  postgres:
    name: Go store tests on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: cadenza
          POSTGRES_DB: cadenza
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test against Postgres
        env:
          CADENZA_TEST_POSTGRES: postgres://postgres:cadenza@localhost:5432/cadenza?sslmode=disable
        run: go test -race ./internal/adapter/sqlstore/...

  s3:
    name: Go S3 adapter on a real store (SeaweedFS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Start SeaweedFS
        run: |
          cat > /tmp/s3.json <<'JSON'
          {"identities":[{"name":"ci","credentials":[{"accessKey":"cikey","secretKey":"cisecret123"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
          JSON
          docker run -d --name s3 -p 8333:8333 -v /tmp/s3.json:/s3.json:ro chrislusf/seaweedfs:4.48 server -s3 -s3.config=/s3.json
          for i in $(seq 1 60); do curl -s -o /dev/null localhost:8333 && break; sleep 1; done
          sleep 3
          docker exec s3 sh -c 'echo "s3.bucket.create -name cadenza" | weed shell'
      - name: Test against SeaweedFS
        env:
          CADENZA_TEST_S3_ENDPOINT: http://localhost:8333
          CADENZA_TEST_S3_REGION: us-east-1
          CADENZA_TEST_S3_BUCKET: cadenza
          CADENZA_TEST_S3_ACCESS_KEY: cikey
          CADENZA_TEST_S3_SECRET_KEY: cisecret123
        run: go test -count=1 -run RealStore -v ./internal/adapter/s3

  docker:
    name: Server image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: docker build -t cadenza:ci .
      - name: Start with an empty volume and check it answers
        run: |
          docker run -d --name cadenza -p 8080:8080 -v cadenza-data:/data cadenza:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
          curl -sf localhost:8080/v1/version | grep -q '"setup_needed":true'
          curl -sf localhost:8080/ | grep -q '<title>Cadenza'
      - name: Server logs
        if: failure()
        run: docker logs cadenza

  web:
    name: Web test, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.nvmrc
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm --filter @cadenza/web build

  build:
    name: Cross-compile ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -tags nodynamic ./...
